<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
    <link rel="stylesheet" href="style/main.css">
    <title>E-T-Card</title>
</head>
<body>
    <!-- 弹窗 -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="modalContent">
            <h2 id="modalTitle"></h2>
            <p id="modalDesc"></p>
            <img id="modalImg" src="" alt="" style="display:none;" />
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="app">
        <!-- 顶栏 -->
        <div id="topBar">
            <span id="statusHint">相机已就绪</span>
            <span id="cardInfo">无透卡</span>
        </div>

        <!-- 预览区 -->
        <div id="previewArea">
            <div id="videoContainer">
                <video id="video" poster="favicon.png" autoplay playsinline muted></video>
                <div id="cardContainer">
                    <canvas id="cardCanvas"></canvas>
                    <div id="dashedBorder"></div>
                </div>
            </div>
        </div>

        <!-- 底栏 -->
        <div id="bottomBar">
            <div id="cardOptionsWrapper">
                <div id="cardOptions"></div>
            </div>
            <div id="shutterArea">
                <button id="captureBtn"></button>
            </div>
        </div>
    </div>
    <script src="script/main.js"></script>
</body>
</html>
